name: Check Conventions

on:
  push:
  pull_request:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  check:
    uses: ./.github/workflows/check-conventions.yml
    with:
      repo_name: ${{ github.event.repository.name }}
      org: OpenAEC-Foundation
      repo_cleaner_ref: ${{ github.sha }}
    secrets:
      gh_token: ${{ github.token }}
