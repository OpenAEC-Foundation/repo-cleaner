name: Check Conventions (Reusable)

on:
  workflow_call:
    inputs:
      repo_name:
        description: Repository name to check
        required: true
        type: string
      org:
        description: GitHub organization
        required: false
        type: string
        default: OpenAEC-Foundation
      repo_cleaner_ref:
        description: repo-cleaner revision to execute
        required: false
        type: string
        default: master
      dynlex_ref:
        description: DynLex revision with stable structural variable-flow inference
        required: false
        type: string
        default: master
      llvm_project_ref:
        description: LLVM revision with transactional clangd file and directory renames
        required: false
        type: string
        default: clangd-file-rename-core
    secrets:
      gh_token:
        description: Token with contents, issues, and pull-request access
        required: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.gh_token || github.token }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Verify GitHub authentication
        run: gh auth status

      - name: Checkout repo-cleaner
        uses: actions/checkout@v4
        with:
          repository: OpenAEC-Foundation/repo-cleaner
          ref: ${{ inputs.repo_cleaner_ref }}
          path: repo-cleaner

      - name: Checkout DynLex
        uses: actions/checkout@v4
        with:
          repository: OpenAEC-Foundation/dynlex
          ref: ${{ inputs.dynlex_ref }}
          submodules: true
          path: dynlex

      - name: Checkout LLVM
        uses: actions/checkout@v4
        with:
          repository: OpenAEC-Foundation/llvm-project
          ref: ${{ inputs.llvm_project_ref }}
          path: llvm-project
          filter: blob:none

      - name: Restore DynLex toolchain
        uses: actions/cache@v4
        with:
          path: dynlex/.cache/llvm-toolchain
          key: dynlex-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dynlex/metadata/LLVM_TOOLCHAIN', 'dynlex/scripts/llvm_toolchain.sh') }}

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: repo-cleaner-ccache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.dynlex_ref }}-${{ inputs.llvm_project_ref }}
          restore-keys: |
            repo-cleaner-ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Install DynLex dependencies
        working-directory: dynlex
        run: ./scripts/install.sh

      - name: Build DynLex
        working-directory: dynlex
        run: ./scripts/build.sh --release

      - name: Build path-rename clangd
        run: |
          set -euo pipefail
          command -v ccache
          command -v clang
          command -v clang++
          command -v cmake
          command -v ninja
          cmake -S llvm-project/llvm -B llvm-project/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLLVM_ENABLE_PROJECTS="clang;clang-tools-extra" \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_TARGETS_TO_BUILD=Native
          cmake --build llvm-project/build --target clangd clang-format --parallel 2
          echo "$GITHUB_WORKSPACE/llvm-project/build/bin" >> "$GITHUB_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install language servers
        run: |
          set -euo pipefail
          rustup component add rust-analyzer rustfmt
          npm install --global typescript-language-server@5.3.0 typescript@6.0.3
          mkdir -p "$HOME/.local/bin"
          curl --fail --location --silent --show-error \
            --output "$HOME/.local/bin/phpactor" \
            https://github.com/phpactor/phpactor/releases/download/2026.07.22.0/phpactor.phar
          echo "8c0155380b9d7559a12f35ddf8d09c1dc23e72f1797498038251fc35ad15574d  $HOME/.local/bin/phpactor" \
            | sha256sum --check --strict
          chmod +x "$HOME/.local/bin/phpactor"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          command -v typescript-language-server
          command -v tsserver
          command -v cargo
          command -v rust-analyzer
          command -v rustfmt
          cargo --version
          rust-analyzer --version
          rustfmt --version
          "$HOME/.local/bin/phpactor" --version

      - name: Verify selected native tools
        run: |
          set -euo pipefail
          test "$(command -v clangd)" = "$GITHUB_WORKSPACE/llvm-project/build/bin/clangd"
          test "$(command -v clang-format)" = "$GITHUB_WORKSPACE/llvm-project/build/bin/clang-format"
          clangd --version
          clang-format --version

      - name: Build repo-cleaner
        working-directory: repo-cleaner
        env:
          DYNLEX: ${{ github.workspace }}/dynlex/build/dynlex
        run: ./scripts/build.sh

      - name: Test repo-cleaner
        working-directory: repo-cleaner
        env:
          DYNLEX: ${{ github.workspace }}/dynlex/build/dynlex
        run: ./scripts/test.sh

      - name: Check and fix repository conventions
        working-directory: repo-cleaner
        run: |
          ./build/repo-conventions-enforcer \
            --repo-naming \
            --fix-code-conventions \
            --readme \
            --single-repo "${{ inputs.repo_name }}" \
            --org "${{ inputs.org }}"
